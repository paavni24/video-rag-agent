<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" role="img" aria-labelledby="title desc">
  <title id="title">Kubrick video question-answering architecture</title>
  <desc id="desc">A browser uploads and asks about videos through a React interface. The FastAPI agent routes questions with Groq and calls the MCP video service. The MCP service indexes video frames and audio in Pixeltable, using OpenAI. Shared media stores uploads and clips; Opik stores prompts and traces.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f5f7fb"/>
      <stop offset="1" stop-color="#eaf0f8"/>
    </linearGradient>
    <linearGradient id="api" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#e9f2ff"/>
      <stop offset="1" stop-color="#d9e8ff"/>
    </linearGradient>
    <linearGradient id="mcp" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#e7f8f2"/>
      <stop offset="1" stop-color="#d5f1e7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#18263c" flood-opacity=".12"/>
    </filter>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#4468b5"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#218369"/>
    </marker>
    <marker id="arrow-gray" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#64748b"/>
    </marker>
    <style>
      text{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#172338}
      .title{font-size:34px;font-weight:750;letter-spacing:-.5px}
      .subtitle{font-size:16px;fill:#607087}
      .heading{font-size:23px;font-weight:720}
      .label{font-size:15px;font-weight:700}
      .body{font-size:14px;fill:#42526a}
      .small{font-size:12px;fill:#607087}
      .card{stroke:#d6deea;stroke-width:1.5}
      .node{fill:#fff;stroke:#d7e0ec;stroke-width:1.3}
      .flow{fill:none;stroke:#4468b5;stroke-width:3;marker-end:url(#arrow-blue)}
      .data{fill:none;stroke:#218369;stroke-width:3;marker-end:url(#arrow-green)}
      .support{fill:none;stroke:#8794a8;stroke-width:2;stroke-dasharray:7 7;marker-end:url(#arrow-gray)}
      .pill{font-size:12px;font-weight:700}
    </style>
  </defs>

  <rect width="1440" height="960" rx="28" fill="url(#bg)"/>
  <circle cx="92" cy="73" r="22" fill="#243b63"/>
  <path d="M82 73h20M92 63v20" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
  <text x="130" y="78" class="title">Kubrick · video question answering</text>
  <text x="130" y="108" class="subtitle">Upload once, build multimodal indexes, then ask questions or find a clip.</text>
  <rect x="1122" y="52" width="250" height="42" rx="21" fill="#fff" stroke="#d6deea"/>
  <circle cx="1147" cy="73" r="6" fill="#3cb48f"/>
  <text x="1164" y="78" class="pill">3 services · 1 shared media store</text>

  <!-- Primary services -->
  <g filter="url(#shadow)">
    <rect x="56" y="166" width="310" height="414" rx="22" fill="#fff" class="card"/>
    <rect x="404" y="166" width="430" height="414" rx="22" fill="url(#api)" class="card"/>
    <rect x="872" y="166" width="512" height="414" rx="22" fill="url(#mcp)" class="card"/>
  </g>

  <!-- Browser / UI -->
  <rect x="82" y="192" width="42" height="28" rx="8" fill="#edf2fb"/>
  <rect x="89" y="199" width="28" height="14" rx="3" fill="#7190c8"/>
  <text x="138" y="214" class="heading">Browser UI</text>
  <text x="82" y="247" class="small">React · Vite · Nginx</text>
  <rect x="82" y="276" width="258" height="91" rx="14" class="node"/>
  <circle cx="108" cy="303" r="12" fill="#dfe9fb"/>
  <path d="M101 303h14m-7-7v14" stroke="#4468b5" stroke-width="2"/>
  <text x="130" y="307" class="label">Upload a video</text>
  <text x="102" y="338" class="body">Choose a clip from your device</text>
  <rect x="82" y="383" width="258" height="91" rx="14" class="node"/>
  <circle cx="108" cy="410" r="12" fill="#dfe9fb"/>
  <path d="M102 409h12m-12 5h9" stroke="#4468b5" stroke-width="2" stroke-linecap="round"/>
  <text x="130" y="414" class="label">Ask or search</text>
  <text x="102" y="445" class="body">Question, scene, or moment</text>
  <rect x="82" y="500" width="258" height="49" rx="13" fill="#eef4ff"/>
  <text x="103" y="530" class="small">Answer + optional video clip</text>

  <!-- API -->
  <rect x="432" y="192" width="42" height="28" rx="8" fill="#c6d9ff"/>
  <path d="M443 206h20m-15-6v12m10-12v12" stroke="#34599f" stroke-width="2" stroke-linecap="round"/>
  <text x="488" y="214" class="heading">Agent API</text>
  <text x="432" y="247" class="small">FastAPI · chat · upload · task status</text>
  <rect x="432" y="276" width="374" height="92" rx="14" fill="#fff" stroke="#c8d7f0"/>
  <rect x="450" y="292" width="94" height="26" rx="13" fill="#e4ecff"/>
  <text x="466" y="310" class="pill" fill="#365a9f">Groq</text>
  <text x="558" y="310" class="label">Router + agent</text>
  <text x="450" y="345" class="body">Choose a direct reply or an MCP tool call</text>
  <rect x="432" y="383" width="374" height="91" rx="14" fill="#fff" stroke="#c8d7f0"/>
  <circle cx="461" cy="412" r="12" fill="#ffe6b5"/>
  <path d="M455 412h12m-6-6v12" stroke="#a9670b" stroke-width="2"/>
  <text x="485" y="416" class="label">Agent memory</text>
  <text x="450" y="446" class="body">Conversation history in Pixeltable</text>
  <rect x="432" y="500" width="374" height="49" rx="13" fill="#f4f7ff"/>
  <text x="454" y="530" class="small">Returns the answer and serves clips</text>

  <!-- MCP -->
  <rect x="900" y="192" width="42" height="28" rx="8" fill="#bdebd8"/>
  <path d="M910 206h22m-11-8v16" stroke="#217b63" stroke-width="2" stroke-linecap="round"/>
  <text x="956" y="214" class="heading">Video MCP</text>
  <text x="900" y="247" class="small">FastMCP · tools · prompts · resources</text>
  <rect x="900" y="276" width="456" height="104" rx="14" fill="#fff" stroke="#b9dfd1"/>
  <text x="922" y="307" class="label">Ingest and index</text>
  <rect x="922" y="326" width="118" height="31" rx="15" fill="#e4f7ef"/>
  <text x="940" y="347" class="pill">Audio → text</text>
  <rect x="1050" y="326" width="132" height="31" rx="15" fill="#e4f7ef"/>
  <text x="1068" y="347" class="pill">Frames → captions</text>
  <rect x="1192" y="326" width="142" height="31" rx="15" fill="#e4f7ef"/>
  <text x="1210" y="347" class="pill">Search embeddings</text>
  <rect x="900" y="395" width="456" height="79" rx="14" fill="#fff" stroke="#b9dfd1"/>
  <circle cx="928" cy="423" r="12" fill="#d5f1e7"/>
  <path d="M921 423h14m-7-7v14" stroke="#218369" stroke-width="2"/>
  <text x="952" y="427" class="label">Find context or cut a clip</text>
  <text x="922" y="454" class="body">Returns matching scenes and transcript context</text>
  <rect x="900" y="500" width="456" height="49" rx="13" fill="#eefaf5"/>
  <text x="922" y="530" class="small">MCP tool results return to the agent</text>

  <!-- Main flow arrows -->
  <path d="M366 327h34" class="flow"/>
  <text x="368" y="309" class="small">upload · chat</text>
  <path d="M834 327h34" class="flow"/>
  <text x="838" y="309" class="small">tool calls</text>
  <path d="M868 424h-34" fill="none" stroke="#218369" stroke-width="3" marker-end="url(#arrow-green)"/>
  <text x="837" y="450" class="small">results</text>

  <!-- Supporting systems -->
  <rect x="56" y="630" width="424" height="244" rx="22" fill="#fff" class="card"/>
  <rect x="506" y="630" width="424" height="244" rx="22" fill="#fff" class="card"/>
  <rect x="956" y="630" width="428" height="244" rx="22" fill="#fff" class="card"/>

  <!-- Shared media -->
  <rect x="82" y="656" width="38" height="32" rx="8" fill="#d5f1e7"/>
  <path d="M91 664h20v15H91zM96 660h20v15" fill="none" stroke="#218369" stroke-width="2"/>
  <text x="134" y="680" class="heading">Shared media</text>
  <text x="82" y="716" class="body">One folder mounted in API and MCP</text>
  <rect x="82" y="744" width="170" height="47" rx="12" fill="#f2f8f5"/>
  <text x="101" y="774" class="label">Uploaded videos</text>
  <rect x="270" y="744" width="184" height="47" rx="12" fill="#f2f8f5"/>
  <text x="287" y="774" class="label">Generated clips</text>
  <text x="82" y="831" class="small">Persistent files · served back to the browser</text>

  <!-- Pixeltable -->
  <rect x="532" y="656" width="38" height="32" rx="8" fill="#f0e8ff"/>
  <ellipse cx="551" cy="664" rx="11" ry="4" fill="none" stroke="#7450ac" stroke-width="2"/>
  <path d="M540 664v13c0 5 22 5 22 0v-13m-22 6c0 5 22 5 22 0" fill="none" stroke="#7450ac" stroke-width="2"/>
  <text x="584" y="680" class="heading">Pixeltable</text>
  <text x="532" y="716" class="body">Persistent indexes and agent memory</text>
  <rect x="532" y="744" width="116" height="47" rx="12" fill="#f6f1ff"/>
  <text x="549" y="774" class="label">Transcripts</text>
  <rect x="660" y="744" width="112" height="47" rx="12" fill="#f6f1ff"/>
  <text x="679" y="774" class="label">Captions</text>
  <rect x="784" y="744" width="120" height="47" rx="12" fill="#f6f1ff"/>
  <text x="803" y="774" class="label">Frame vectors</text>
  <text x="532" y="831" class="small">Separate Docker volumes for MCP and API</text>

  <!-- Providers and observability -->
  <rect x="982" y="656" width="38" height="32" rx="8" fill="#e5ebf5"/>
  <circle cx="1001" cy="672" r="9" fill="none" stroke="#50627f" stroke-width="2"/>
  <path d="M1001 666v6l4 3" fill="none" stroke="#50627f" stroke-width="2" stroke-linecap="round"/>
  <text x="1034" y="680" class="heading">External services</text>
  <rect x="982" y="716" width="116" height="47" rx="12" fill="#eaf0ff"/>
  <text x="1008" y="746" class="label">Groq</text>
  <text x="1110" y="733" class="small">Chat + routing</text>
  <rect x="982" y="775" width="116" height="47" rx="12" fill="#e6f7ef"/>
  <text x="1003" y="805" class="label">OpenAI</text>
  <text x="1110" y="792" class="small">Transcription, captions</text>
  <text x="1110" y="809" class="small">and embeddings</text>
  <rect x="1240" y="716" width="118" height="106" rx="15" fill="#fff5e8" stroke="#f1ddc0"/>
  <text x="1263" y="752" class="label">Opik</text>
  <text x="1256" y="779" class="small">Prompts</text>
  <text x="1256" y="798" class="small">+ traces</text>
  <text x="982" y="846" class="small">Credentials stay in service environment files</text>

  <!-- Supporting connections -->
  <path d="M570 580v30H268v20" class="support"/>
  <path d="M1125 580v30H718v20" class="support"/>
  <path d="M718 580v70" class="support"/>
  <path d="M625 580v30H1124v20" class="support"/>
  <text x="62" y="918" class="small">Solid arrows show requests and results. Dashed lines show shared storage and service integrations.</text>
</svg>
